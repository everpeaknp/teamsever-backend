version: '3.8'

services:
  backend:
    image: ghcr.io/everpeaknp/teamsever-backend:latest
    container_name: teamsever-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - teamsever-network
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:alpine
    container_name: teamsever-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - teamsever-network

networks:
  teamsever-network:
    driver: bridge

volumes:
  redis_data:
